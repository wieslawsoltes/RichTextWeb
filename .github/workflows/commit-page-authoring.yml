name: Commit rich page authoring source
on:
  push:
    branches: [feat/rich-page-stories-0.5]
    paths: [.github/page-authoring.part-1.xz, .github/page-authoring.part-2.xz, .github/workflows/commit-page-authoring.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rich-page-stories-0.5
      - name: Verify and apply reviewed source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          compressed = b''.join(pathlib.Path(f'.github/page-authoring.part-{i}.xz').read_bytes() for i in (1, 2))
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '3ab7ebedd391974b93e50dc29da61678bcb76b0ebb28af0fdb029b90ecae89f5', 'Source patch integrity mismatch'
          pathlib.Path('/tmp/page-authoring.patch').write_bytes(patch)
          PY
          git apply --check /tmp/page-authoring.patch
          git apply /tmp/page-authoring.patch
          git rm .github/page-authoring.part-1.xz .github/page-authoring.part-2.xz .github/workflows/commit-page-authoring.yml
          git add docs/PAGE-AUTHORING.md sample/word-ribbon.js scripts/browser-test.mjs src/control-renderer.ts src/control.ts src/core.ts src/document-features.ts src/engine.ts src/formats-docx.ts src/index.ts src/page-setup.ts src/pagination.ts src/story-session.ts src/toolbar.ts tests/page-authoring.browser.mjs tests/page-authoring.test.ts tests/toolbar.browser.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add rich page stories and bounded page-container virtualization'
          git push origin HEAD:refs/heads/feat/rich-page-stories-0.5
