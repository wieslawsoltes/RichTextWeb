name: Native style margin qualification
on:
  push:
    branches: [work/document-styles-source]
    paths: [.github/workflows/document-style-margin-fix.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply verified regression fix
        run: |
          mkdir -p qualification
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '883967df389c6ec176930aeb286be1b66d503cdf7bdfa62726838a94b05df7bc'
          pathlib.Path('/tmp/margins.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/margins.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/margins.patch'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/document-style-margin-fix.yml
          git diff --cached --check
          git commit -m 'fix: preserve named margins for native line-height and first-line-only overrides'
          git push origin HEAD:refs/heads/work/document-styles-source
          git rev-parse HEAD > qualification/source-sha.txt
          git rev-parse 'HEAD^{tree}' > qualification/source-tree.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check 2>&1 | tee qualification/check.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-style-margin-qualification
          path: qualification/
          retention-days: 7
