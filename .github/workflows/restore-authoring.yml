name: Restore verified authoring source
on:
  push:
    branches: [feat/restored-word-authoring]
    paths: [.github/workflows/restore-authoring.yml]
permissions:
  contents: read
jobs:
  restore:
    if: github.ref == 'refs/heads/feat/restored-word-authoring'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct the locally reviewed and unit-tested source patch
        shell: python
        run: |
          import hashlib, json, lzma, os, pathlib, re
          raw = b''.join(pathlib.Path(f'recovery/authoring-part-{i:02}.xz').read_bytes() for i in range(1, 8))
          patch = lzma.decompress(raw)
          assert len(patch) == 247265
          assert hashlib.sha256(patch).hexdigest() == 'd9576cceac9f20b4fa410e4578a8d058ab7addb44811415fb833c11be3f96720'
          paths = re.findall(rb'^diff --git a/(\S+) b/(\S+)$', patch, re.M)
          assert len(paths) == 37
          for before, after in paths:
              assert before == after and b'..' not in after
              assert after.startswith((b'src/', b'tests/', b'sample/', b'scripts/', b'adapters/dotnet/', b'docs/')) or after in (b'package.json', b'package-lock.json')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'authoring.patch').write_bytes(patch)
          package = pathlib.Path('package.json')
          package.write_text(json.dumps(json.loads(package.read_text()), indent=2, ensure_ascii=False) + '\n')
      - name: Apply source and remove recovery-only transport files
        run: |
          git apply --check "$RUNNER_TEMP/authoring.patch"
          git apply "$RUNNER_TEMP/authoring.patch"
          git rm recovery/authoring-part-*.xz .github/workflows/restore-authoring.yml
          git add src tests sample scripts adapters/dotnet docs/AUTHORING.md package.json package-lock.json
          git diff --cached --check
          git diff --cached --stat
      - name: Commit only to the requested authoring feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore complete Word authoring, equation and view-mode implementation'
          git push origin HEAD:refs/heads/feat/restored-word-authoring
          git archive --format=tar.gz HEAD -o restored-authoring-source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: restored-authoring-source
          path: restored-authoring-source.tar.gz
          retention-days: 7
