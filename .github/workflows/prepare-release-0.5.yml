name: Commit release 0.5.0 source
on:
  push:
    branches: [release/v0.5.0]
    paths: [.github/release-0.5.patch.xz, .github/workflows/prepare-release-0.5.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.5.0
      - name: Verify and commit release versions, documentation and DOCX regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          patch = lzma.decompress(pathlib.Path('.github/release-0.5.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '20ccf22972845022c6e7a855dcbf512cfddd680840232e787b15a4b6ff55c08c', 'Release patch integrity mismatch'
          pathlib.Path('/tmp/release-0.5.patch').write_bytes(patch)
          PY
          git apply --check /tmp/release-0.5.patch
          git apply /tmp/release-0.5.patch
          git rm .github/release-0.5.patch.xz .github/workflows/prepare-release-0.5.yml
          git add CHANGELOG.md README.md adapters/dotnet/Directory.Build.props docs/COMPATIBILITY.md docs/VERIFICATION.md docs/release-notes.md package-lock.json package.json src/formats-docx.ts tests/page-authoring.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare RichTextWeb 0.5.0 and preserve measured DOCX column geometry'
          git push origin HEAD:refs/heads/release/v0.5.0
