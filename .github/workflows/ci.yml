name: CI and distribution
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Record benchmark observations
        if: matrix.node == 24
        run: node scripts/benchmark.mjs --json > benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-node-${{ matrix.node }}
          path: |
            test-results/
            benchmark.json
          if-no-files-found: ignore
  package:
    needs: [verify, desktop]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:demo
      - run: npm pack --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: artifacts/desktop
          merge-multiple: true
      - name: Archive standalone library and sample
        run: |
          tar -czf richtextweb-browser.tar.gz -C dist .
          tar -czf richtextweb-sample.tar.gz -C site .
          tar -czf richtextweb-desktop.tar.gz -C artifacts/desktop .
          git archive --format=tar.gz -o richtextweb-source.tar.gz HEAD
          sha256sum *.tgz *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: |
            *.tgz
            *.tar.gz
            SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
  pages:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Deploy sample
        id: deployment
        uses: actions/deploy-pages@v5
  pages-smoke:
    needs: pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this exact deployment
        env:
          BROWSER_TEST_URL: https://wieslawsoltes.github.io/RichTextWeb/
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          let matched = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const url = new URL('build-info.json', process.env.BROWSER_TEST_URL);
              url.searchParams.set('commit', process.env.GITHUB_SHA);
              url.searchParams.set('attempt', String(attempt));
              const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(5000) });
              if (response.ok) {
                const data = await response.json();
                if (data.Version === version && data.Commit === process.env.GITHUB_SHA) { matched = true; break; }
              }
            } catch (error) { console.log(error.message); }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          assert(matched, 'GitHub Pages did not serve the checked release commit within the bounded wait');
          JS
      - name: Exercise the public sample
        env:
          BROWSER_TEST_URL: https://wieslawsoltes.github.io/RichTextWeb/
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-pages-verification
          path: test-results/
          if-no-files-found: warn
  release:
    needs: [package, pages-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distribution
      - name: Publish immutable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          tag="v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "RichTextWeb $version" --notes-file docs/release-notes.md *.tgz *.tar.gz SHA256SUMS.txt
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          if [[ "$(git rev-list -n 1 "$tag")" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Version already released from another commit. Bump package.json to publish a new version.'
          fi
  npm:
    needs: release
    if: needs.release.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      expected_sha: ${{ github.sha }}
      dist_tag: latest
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
