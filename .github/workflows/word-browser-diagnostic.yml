name: Word browser diagnostics
on:
  push:
    branches: [feat/word-authoring-audit]
    paths: [.github/workflows/word-browser-diagnostic.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Capture failed browser step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/wieslawsoltes/RichTextWeb/actions/jobs/105968966376/logs > job.log
          python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path('job.log').read_text().splitlines()
          text = '\n'.join(lines[-140:])
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          pathlib.Path('browser-failure.log').write_text(text)
          print(text)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: word-browser-diagnostics
          path: browser-failure.log
          retention-days: 1
