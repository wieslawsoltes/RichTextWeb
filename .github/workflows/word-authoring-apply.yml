name: Word authoring qualification
on:
  push:
    branches: [feat/word-authoring-audit]
    paths: [.github/workflows/word-authoring-apply.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve page-field caches when inserting another field
        run: |
          mkdir -p qualification
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/toolbar.ts')
          s = p.read_text()
          old = 'features.InsertField(data.type as FieldType, data.argument);\n                features.UpdateFields(editor.GetFieldContext());'
          new = 'features.InsertField(data.type as FieldType, data.argument);\n                // Insertion is not a request to recalculate existing page fields.\n                // A batched change can still expose the previous layout revision.\n                features.UpdateFields();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src/toolbar.ts
          git commit -m 'fix: preserve cached page fields during field insertion'
          git push origin HEAD:refs/heads/feat/word-authoring-audit
          git rev-parse HEAD > qualification/source-sha.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci 2>&1 | tee qualification/install.log
      - run: npm run typecheck 2>&1 | tee qualification/typecheck.log
      - run: npm run check 2>&1 | tee qualification/check.log
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser 2>&1 | tee qualification/browser.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: word-authoring-qualification
          path: |
            test-results/
            qualification/
          if-no-files-found: warn
