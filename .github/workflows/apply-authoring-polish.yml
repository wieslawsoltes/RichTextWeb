name: Commit verified authoring changes
on:
  push:
    branches: [feat/authoring-polish-0.4]
    paths: [.github/authoring-polish.patch.xz, .github/workflows/apply-authoring-polish.yml]
permissions:
  contents: write
jobs:
  commit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/authoring-polish-0.4
      - name: Verify and apply the reviewed source diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          patch = lzma.decompress(pathlib.Path('.github/authoring-polish.patch.xz').read_bytes())
          expected = '6355971444595e5fd82a906eb76c224fbc33ccae21d20b0e79d67139871328fd'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Authoring patch integrity mismatch'
          pathlib.Path('/tmp/authoring-polish.patch').write_bytes(patch)
          PY
          git apply --check /tmp/authoring-polish.patch
          git apply /tmp/authoring-polish.patch
          rm .github/authoring-polish.patch.xz .github/workflows/apply-authoring-polish.yml
          git add docs/AUTHORING.md scripts/browser-test.mjs src/control.ts src/engine-tree.ts src/equation-control.ts src/equation-structure.ts src/equations.ts src/formats.ts src/page-window.ts src/toolbar.ts tests/authoring-polish.browser.mjs tests/authoring-polish.test.ts
          git add -u .github/authoring-polish.patch.xz .github/workflows/apply-authoring-polish.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add structural equation editing and fix pagination navigation and continuation'
          git push origin HEAD:refs/heads/feat/authoring-polish-0.4
