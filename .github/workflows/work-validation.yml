name: Isolated Word feature development
on:
  push:
    branches: [work/word-layout-equations]
    paths: [.github/workflows/work-validation.yml, .github/work/changes.patch]
permissions:
  contents: read
jobs:
  recovery:
    if: github.ref == 'refs/heads/work/word-layout-equations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz HEAD -o authoring-recovery.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: authoring-recovery
          path: authoring-recovery.tar.gz
          retention-days: 3
