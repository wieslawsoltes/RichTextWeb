name: Native Avalonia WYSIWYG
on:
  push:
    branches: [feat/native-avalonia-wysiwyg]
    paths: ['native/AvaloniaWysiwyg/**', '.github/workflows/native-avalonia.yml']
  pull_request:
    paths: ['native/AvaloniaWysiwyg/**', '.github/workflows/native-avalonia.yml']
permissions:
  contents: read
concurrency:
  group: native-avalonia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.toolchain/dotnet
      NUGET_PACKAGES: ${{ github.workspace }}/.toolchain/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Install browser toolchain
        run: dotnet workload install wasm-tools
      - name: Restore validation dependencies and publish browser bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .toolchain/bootstrap
          cd .toolchain/bootstrap
          cat > bootstrap.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk.WebAssembly">
            <PropertyGroup>
              <TargetFramework>net10.0-browser</TargetFramework>
              <OutputType>Exe</OutputType>
              <RuntimeIdentifier>browser-wasm</RuntimeIdentifier>
              <WasmMainJSPath>main.js</WasmMainJSPath>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <PublishTrimmed>false</PublishTrimmed>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Avalonia.Browser" Version="12.1.3" />
              <PackageReference Include="Avalonia.Desktop" Version="12.1.3" />
              <PackageReference Include="Avalonia.Themes.Fluent" Version="12.1.3" />
              <PackageReference Include="Avalonia.Fonts.Inter" Version="12.1.3" />
              <PackageReference Include="Avalonia.Headless" Version="12.1.3" />
              <PackageReference Include="AngleSharp" Version="1.3.0" />
              <PackageReference Include="Markdig" Version="0.41.3" />
            </ItemGroup>
          </Project>
          EOF
          printf 'System.Console.WriteLine("Native Avalonia toolchain ready");\n' > Program.cs
          printf 'import { dotnet } from "./_framework/dotnet.js"; await dotnet.run();\n' > main.js
          dotnet publish -c Release -o published
          dotnet --info > ../dotnet-info.txt
          cd ..
          tar -I 'zstd -T0 -3' -cf toolchain.tar.zst dotnet packages dotnet-info.txt
          sha256sum toolchain.tar.zst > toolchain.sha256
          split -b 384M -d toolchain.tar.zst toolchain.part-
          sha256sum toolchain.part-* > parts.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: native-avalonia-toolchain-00
          path: |
            .toolchain/toolchain.part-00
            .toolchain/toolchain.sha256
            .toolchain/parts.sha256
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: native-avalonia-toolchain-01
          path: .toolchain/toolchain.part-01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: native-avalonia-toolchain-02
          path: .toolchain/toolchain.part-02
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.toolchain/toolchain.part-03') != '' }}
        with:
          name: native-avalonia-toolchain-03
          path: .toolchain/toolchain.part-03
          compression-level: 0
          retention-days: 3
