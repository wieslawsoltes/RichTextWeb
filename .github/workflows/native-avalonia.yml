name: Native Avalonia WYSIWYG
on:
  push:
    branches: [feat/native-avalonia-wysiwyg]
    paths: ['native/AvaloniaWysiwyg/**', '.github/workflows/native-avalonia.yml']
  pull_request:
    paths: ['native/AvaloniaWysiwyg/**', '.github/workflows/native-avalonia.yml']
permissions:
  contents: read
concurrency:
  group: native-avalonia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/AvaloniaWysiwyg
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Core and interchange regression tests
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          dotnet run --project tests/Wysiwyg.Core.Tests -c Release 2>&1 | tee artifacts/core-tests.log
      - name: Build desktop sample
        if: ${{ hashFiles('native/AvaloniaWysiwyg/samples/Folio.Desktop/Folio.Desktop.csproj') != '' }}
        run: dotnet build samples/Folio.Desktop -c Release
      - name: Install WebAssembly toolchain
        if: ${{ hashFiles('native/AvaloniaWysiwyg/samples/Folio.Browser/Folio.Browser.csproj') != '' }}
        run: dotnet workload install wasm-tools
      - name: Publish browser sample
        if: ${{ hashFiles('native/AvaloniaWysiwyg/samples/Folio.Browser/Folio.Browser.csproj') != '' }}
        run: |
          set -euxo pipefail
          dotnet publish samples/Folio.Browser -c Release -o artifacts/browser 2>&1 | tee artifacts/browser-build.log
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('native/AvaloniaWysiwyg/tests/browser/package.json') != '' }}
        with:
          node-version: 22
      - name: Exercise real Avalonia browser application
        if: ${{ hashFiles('native/AvaloniaWysiwyg/tests/browser/package.json') != '' }}
        run: |
          set -euxo pipefail
          cd tests/browser
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
          npm test
      - name: Package source
        if: always()
        run: |
          git archive --format=zip --output=artifacts/AvaloniaWysiwyg-source.zip HEAD:native/AvaloniaWysiwyg
          git rev-parse HEAD > artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-avalonia-validation
          path: native/AvaloniaWysiwyg/artifacts/
          retention-days: 14
          if-no-files-found: error
